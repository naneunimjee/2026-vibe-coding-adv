name: 사이트 빌드·배포

# 코드나 호 데이터를 고쳐 main에 올리면 다시 배포해요 (정정 배포, UC-009). 매일 발행은 publish.yml이 해요.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAN_DEPLOY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.SITE_URL != '' }}
    steps:
      # 액션은 태그가 아니라 커밋 SHA로 고정해요. 이 작업은 push하지 않으니 토큰을 저장하지 않아요.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m unittest discover -s tests -v

      # 첫 호가 발행되기 전에는 만들 사이트가 없어요.
      - name: 사이트 생성
        if: hashFiles('data/issues/*.json') != ''
        run: python build.py
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          GA_ID: ${{ vars.GA_ID }}

      # Cloudflare 비밀 값·SITE_URL을 모두 등록하기 전에는 이 단계를 건너뛰어요.
      - name: Cloudflare Pages에 배포
        if: github.ref == 'refs/heads/main' && env.CAN_DEPLOY == 'true' && hashFiles('data/issues/*.json') != ''
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          wranglerVersion: "4.168.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=it-newsletter --branch=main
