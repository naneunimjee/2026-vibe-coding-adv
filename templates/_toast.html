<div class="nl-toast nl-toast--floating" role="status" aria-live="polite" id="toast" hidden>
  <span class="nl-toast__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
  <span id="toast-text"></span>
</div>
<script>
  function showToast(text) {
    var t = document.getElementById('toast');
    document.getElementById('toast-text').textContent = text;
    t.hidden = false;
    requestAnimationFrame(function () { t.classList.add('is-on'); });
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function () { t.classList.remove('is-on'); }, 3000);
  }
</script>
