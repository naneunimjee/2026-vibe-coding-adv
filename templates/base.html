<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · IT 뉴스레터</title>
<meta name="description" content="{% block description %}매일 아침 IT 트렌드, 이슈, 오늘의 공부 주제를 원문에 근거해 요약해요.{% endblock %}">
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/site.css">
<link rel="alternate" type="application/rss+xml" title="IT 뉴스레터" href="/feed.xml">
</head>
<body class="nl-page">
<header class="nl-header"><div class="nl-container nl-header__inner">
  <a class="nl-logo" href="/"><span class="nl-logo__mark"></span>IT 뉴스레터</a>
  <nav class="nl-nav" aria-label="주 메뉴">
    {%- for item in nav %}
    <a href="{{ item.url }}"{% if item.id == active %} class="is-active" aria-current="page"{% endif %}>{{ item.label }}</a>
    {%- endfor %}
  </nav>
  {% if active == "home" %}<a class="nl-btn nl-btn--m nl-btn--dark" href="/archive/">지난 호 검색</a>{% else %}<a class="nl-btn nl-btn--m nl-btn--dark" href="/">오늘 호 보기</a>{% endif %}
</div></header>

{% block main %}{% endblock %}

<footer class="nl-footer"><div class="nl-container nl-footer__inner">
  <div>
    <a class="nl-logo" href="/"><span class="nl-logo__mark"></span>IT 뉴스레터</a>
    <p>매일 아침 {{ sources | join(", ") }}에서 모은 소식을 정리해요. 요약은 원문을 바탕으로 자동 생성돼요. 정확한 내용은 원문에서 확인해 주세요.</p>
  </div>
  <nav aria-label="보조 메뉴"><a href="/about/">소개</a><a href="/archive/">지난 호</a><a href="/feed.xml">RSS</a></nav>
</div></footer>
{% block scripts %}{% endblock %}
</body>
</html>
